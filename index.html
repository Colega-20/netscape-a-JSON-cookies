<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="Netscape a JSON" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="color-scheme" content="dark" />
  <title>Netscape a JSON</title>
  <link rel="icon" href="icono.png" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="overlay" id="overlay" role="alert" aria-label="Cargando">
    <div class="throbber"></div>
  </div>

  <header class="topbar">
    <span class="badge">v2.0</span>
    <div class="lang">
      <label for="languageSelector" data-i18n="language">Idioma</label>
      <select id="languageSelector">
        <option value="es">Español</option>
        <option value="en">English</option>
      </select>
    </div>
  </header>

  <main class="app">
    <div class="hero">
      <h1 data-i18n="title">Netscape a formato JSON</h1>
      <p data-i18n="subtitle"></p>
    </div>

    <form id="conversionForm" novalidate>
      <div class="panes">
        <!-- Entrada -->
        <section class="pane">
          <div class="pane-head">
            <label for="cook">Netscape</label>
            <div class="pane-tools">
              <button type="button" class="btn btn-ghost" id="btnPaste" data-i18n="paste">Pegar</button>
              <button type="button" class="btn btn-ghost" id="btnClear" data-i18n="clear">Limpiar</button>
            </div>
          </div>
          <textarea id="cook" name="cook" rows="10" spellcheck="false" autocomplete="off" autocapitalize="off"
            data-i18n-placeholder="phNetscape"></textarea>
          <div class="stats" id="stats" aria-live="polite"></div>
        </section>

        <!-- Salida -->
        <section class="pane">
          <div class="pane-head">
            <label for="result">JSON</label>
            <div class="pane-tools">
              <button type="button" class="btn btn-ghost" id="btnCopy" data-i18n="copy">Copiar</button>
            </div>
          </div>
          <textarea id="result" name="result" rows="10" spellcheck="false" readonly
            data-i18n-placeholder="phJSON"></textarea>
        </section>
      </div>

      <!-- Archivos -->
      <label class="dropzone" id="dropzone" for="file-input">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <path d="M12 16V4m0 0l-4 4m4-4l4 4" />
          <path d="M4 14v4a2 2 0 002 2h12a2 2 0 002-2v-4" />
        </svg>
        <strong data-i18n="dropTitle">Arrastra tus archivos .txt aquí</strong>
        <span data-i18n="dropAction">o selecciona archivo(s)</span>
        <input type="file" id="file-input" class="sr-only" accept=".txt,text/plain" multiple />
      </label>

      <div class="files" id="filesBlock" hidden>
        <div class="files-head">
          <span id="filesTitle"></span>
          <button type="button" class="btn btn-ghost" id="btnClearFiles" data-i18n="clearFiles">Quitar todos</button>
        </div>
        <ul class="file-list" id="fileList"></ul>
      </div>

      <!-- Opciones y acciones -->
      <div class="controls">
        <label class="switch">
          <input type="checkbox" id="keepTxtFormat" class="sr-only" />
          <span class="track" aria-hidden="true"></span>
          <span data-i18n="keepTxt">Mantener formato .txt</span>
        </label>

        <div class="actions">
          <button type="button" class="btn btn-primary" id="btnConvertir" data-i18n="btnConvert">Convertir y
            copiar</button>
          <button type="button" class="btn btn-success" id="convert" data-i18n="btnDownload">Convertir y
            descargar</button>
        </div>

        <p class="hint" data-i18n="hint"></p>
      </div>
    </form>
  </main>

  <footer class="footer">
    <div id="copyright"></div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- JSZip solo se usa al descargar varios archivos a la vez -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
  <script src="script.js" defer></script>

  <script>
    //notas
    const notas = {
      //version: "v1.0.1",
      build: "build 15.10.2026",
      fecha: "Fecha inicial: 29-3-2024",
      //by: 'By Colega/Edisson',
    };

    //console.log(notas['version']);
    console.log(notas["build"]);
    console.log(notas["fecha"]);
    //console.log(notas['by']);
  </script>
</body>

</html>
